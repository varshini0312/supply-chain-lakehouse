trigger:
  branches:
    include: [main, develop]
pr:
  branches:
    include: [main, develop]

variables:
  - group: supply-chain-secrets   # DATABRICKS_HOST, DATABRICKS_TOKEN, ADF names etc.
  - name: pythonVersion
    value: '3.10'

stages:
  - stage: CI
    displayName: Build & Test
    jobs:
      - job: lint_test
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '$(pythonVersion)' }
          - script: |
              pip install -r requirements.txt flake8
              flake8 src tests --max-line-length 120
              pytest --junitxml=test-results.xml
            displayName: Lint + unit tests
          - task: PublishTestResults@2
            inputs: { testResultsFiles: test-results.xml }
          - script: |
              python -m json.tool adf/pipeline/pl_master_supply_chain.json > /dev/null
              for f in adf/*/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
            displayName: Validate ADF JSON
          - publish: $(Build.SourcesDirectory)
            artifact: drop

  - stage: DeployDev
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: dev
        environment: supply-chain-dev
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                    databricks bundle validate -t dev
                    databricks bundle deploy -t dev
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                  displayName: Deploy Databricks bundle (dev)
                - task: AzureCLI@2
                  displayName: Deploy ADF artifacts (dev)
                  inputs:
                    azureSubscription: sc-service-connection
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      for t in linkedService dataset pipeline trigger; do
                        for f in $(Pipeline.Workspace)/drop/adf/$t/*.json; do
                          n=$(basename $f .json)
                          az datafactory $( [ $t = linkedService ] && echo linked-service || echo $t ) create \
                            --resource-group $(RG) --factory-name $(ADF_DEV) --name $n --properties @$f || true
                        done
                      done

  - stage: DeployProd
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: prod
        environment: supply-chain-prod   # configure manual approval on this environment
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                    databricks bundle deploy -t prod
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST_PROD)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN_PROD)
                  displayName: Deploy Databricks bundle (prod)
